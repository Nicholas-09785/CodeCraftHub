<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Learning Management Platform</title>
    <style>
      /* ── Design tokens ────────────────────────────────────────────── */
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #C4B5FD;
        --primary-soft: #EDE9FE;
        --success: #F59E0B;
        --success-dark: #D97706;
        --success-soft: #FEF3C7;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --danger-soft: #FEE2E2;
        --neutral-900: #111827;
        --neutral-800: #1F2937;
        --neutral-700: #374151;
        --neutral-600: #4B5563;
        --neutral-500: #6B7280;
        --neutral-400: #9CA3AF;
        --neutral-300: #D1D5DB;
        --neutral-200: #E5E7EB;
        --neutral-100: #F3F4F6;
        --neutral-50: #F9FAFB;
        --white: #FFFFFF;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.10), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      /* ── Reset ────────────────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      body {
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        color: var(--neutral-800);
        background-color: var(--neutral-50);
        min-height: 100vh;
      }

      button, input, textarea, select {
        font-family: inherit;
        font-size: inherit;
      }

      button { cursor: pointer; }

      /* ── Header ───────────────────────────────────────────────────── */
      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--white);
        padding: 2.5rem 1.5rem;
        text-align: center;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 400px;
        height: 400px;
        background: rgba(255,255,255,0.06);
        border-radius: 50%;
      }

      .header::after {
        content: '';
        position: absolute;
        bottom: -40%;
        left: -8%;
        width: 280px;
        height: 280px;
        background: rgba(245,158,11,0.10);
        border-radius: 50%;
      }

      .header-content { position: relative; z-index: 1; }

      .header h1 {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-bottom: 0.4rem;
      }

      .header p {
        font-size: 0.95rem;
        opacity: 0.85;
        font-weight: 400;
      }

      /* ── Layout ───────────────────────────────────────────────────── */
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      /* ── Section heading ──────────────────────────────────────────── */
      .section-title {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .section-title .count-badge {
        background: var(--primary-soft);
        color: var(--primary-dark);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 99px;
      }

      /* ── Form panel ───────────────────────────────────────────────── */
      .panel {
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        overflow: hidden;
      }

      .panel-header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--neutral-200);
        background: var(--neutral-50);
      }

      .panel-header h2 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--neutral-800);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .panel-header h2 .icon {
        width: 20px;
        height: 20px;
        color: var(--primary);
      }

      .panel-body { padding: 1.25rem; }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      .form-field { display: flex; flex-direction: column; gap: 0.35rem; }

      .form-field.full { grid-column: 1 / -1; }

      .form-field label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--neutral-700);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .form-field label .req { color: var(--danger); }

      .form-field input,
      .form-field textarea,
      .form-field select {
        border: 1.5px solid var(--neutral-300);
        border-radius: var(--radius-md);
        padding: 0.6rem 0.75rem;
        color: var(--neutral-800);
        background: var(--white);
        transition: border-color var(--transition), box-shadow var(--transition);
        width: 100%;
      }

      .form-field input:focus,
      .form-field textarea:focus,
      .form-field select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
      }

      .form-field input.error,
      .form-field textarea.error,
      .form-field select.error {
        border-color: var(--danger);
        background: var(--danger-soft);
      }

      .form-field textarea {
        resize: vertical;
        min-height: 70px;
        line-height: 1.45;
      }

      .form-actions {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 1.25rem;
      }

      /* ── Buttons ──────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        border: 1.5px solid transparent;
        border-radius: var(--radius-md);
        padding: 0.6rem 1.1rem;
        font-weight: 600;
        font-size: 0.875rem;
        transition: background-color var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition), transform var(--transition);
        white-space: nowrap;
        line-height: 1;
      }

      .btn .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .btn:active { transform: scale(0.97); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }

      .btn-primary {
        background: var(--primary);
        color: var(--white);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
        box-shadow: var(--shadow-md);
      }

      .btn-secondary {
        background: var(--white);
        border-color: var(--neutral-300);
        color: var(--neutral-700);
      }
      .btn-secondary:hover:not(:disabled) {
        border-color: var(--neutral-400);
        background: var(--neutral-50);
      }

      .btn-success {
        background: var(--success);
        color: var(--white);
      }
      .btn-success:hover:not(:disabled) {
        background: var(--success-dark);
        box-shadow: var(--shadow-md);
      }

      .btn-danger {
        background: var(--danger);
        color: var(--white);
      }
      .btn-danger:hover:not(:disabled) {
        background: var(--danger-dark);
        box-shadow: var(--shadow-md);
      }

      .btn-ghost-danger {
        background: transparent;
        color: var(--danger);
        border-color: transparent;
        padding: 0.45rem;
      }
      .btn-ghost-danger:hover:not(:disabled) {
        background: var(--danger-soft);
      }

      .btn-ghost-primary {
        background: transparent;
        color: var(--primary);
        border-color: transparent;
        padding: 0.45rem;
      }
  .btn-ghost-primary:hover:not(:disabled) {
        background: var(--primary-soft);
      }

      .btn-sm { padding: 0.45rem 0.75rem; font-size: 0.8rem; }

      /* ── Courses section ──────────────────────────────────────────── */
      .courses-section { margin-top: 2rem; }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .toolbar .right { display: flex; align-items: center; gap: 0.5rem; }

      .sort-select {
        border: 1.5px solid var(--neutral-300);
        border-radius: var(--radius-md);
        padding: 0.4rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--neutral-700);
        background: var(--white);
        cursor: pointer;
        transition: border-color var(--transition);
      }
      .sort-select:focus { outline: none; border-color: var(--primary); }

      /* ── Course table (desktop) ───────────────────────────────────── */
      .table-wrapper {
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        overflow: hidden;
      }

      .course-table {
        width: 100%;
        border-collapse: collapse;
      }

      .course-table thead { background: var(--neutral-50); }

      .course-table th {
        text-align: left;
        padding: 0.7rem 1rem;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--neutral-500);
        border-bottom: 1px solid var(--neutral-200);
        white-space: nowrap;
      }

      .course-table td {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--neutral-100);
        vertical-align: top;
        font-size: 0.875rem;
      }

      .course-table tbody tr {
        transition: background-color var(--transition);
      }
      .course-table tbody tr:hover { background: var(--neutral-50); }
      .course-table tbody tr:last-child td { border-bottom: none; }

      .course-name { font-weight: 600; color: var(--neutral-900); }

      .course-description {
        color: var(--neutral-600);
        max-width: 280px;
        line-height: 1.45;
      }

      .course-date {
        color: var(--neutral-700);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .course-created {
        color: var(--neutral-400);
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .row-actions { white-space: nowrap; text-align: right; }

      /* ── Status badges ────────────────────────────────────────────── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.25rem 0.65rem;
        border-radius: 99px;
        white-space: nowrap;
      }

      .status-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .status-not-started {
        background: var(--neutral-100);
        color: var(--neutral-600);
      }
      .status-not-started .dot { background: var(--neutral-400); }

      .status-in-progress {
        background: var(--success-soft);
        color: var(--success-dark);
      }
      .status-in-progress .dot { background: var(--success); }

      .status-completed {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }
      .status-completed .dot { background: var(--primary); }

      /* ── Card layout (mobile) ─────────────────────────────────────── */
      .course-cards { display: none; }

      .course-card {
        background: var(--white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--neutral-200);
        padding: 1rem;
        margin-bottom: 0.75rem;
      }

      .course-card .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .course-card .card-name { font-weight: 700; font-size: 1rem; color: var(--neutral-900); }

      .course-card .card-desc {
        color: var(--neutral-600);
        font-size: 0.85rem;
        margin-bottom: 0.6rem;
        line-height: 1.45;
      }

      .course-card .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        font-size: 0.8rem;
        color: var(--neutral-500);
        margin-bottom: 0.75rem;
      }

      .course-card .card-actions {
        display: flex;
        gap: 0.5rem;
        border-top: 1px solid var(--neutral-100);
        padding-top: 0.75rem;
      }

      /* ── Spinner / loading ────────────────────────────────────────── */
      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      .spinner-lg {
        width: 28px;
        height: 28px;
        border-width: 3px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 3rem 1.5rem;
        color: var(--neutral-500);
        font-weight: 500;
      }

      /* ── Empty state ──────────────────────────────────────────────── */
      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--neutral-400);
      }

      .empty-state .empty-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 0.75rem;
        opacity: 0.4;
      }

      .empty-state p { font-weight: 500; font-size: 0.9rem; }
      .empty-state small { font-size: 0.8rem; color: var(--neutral-300); }

      /* ── Toast notifications ──────────────────────────────────────── */
      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        pointer-events: none;
        max-width: 360px;
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        font-size: 0.85rem;
        font-weight: 500;
        box-shadow: var(--shadow-xl);
        animation: toastIn 200ms ease-out;
        pointer-events: auto;
        border-left: 4px solid;
        background: var(--white);
      }

      .toast.removing { animation: toastOut 200ms ease-in forwards; }

      .toast .toast-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
      .toast .toast-msg { flex: 1; line-height: 1.4; }
      .toast .toast-close { background: none; border: none; color: var(--neutral-400); padding: 0; cursor: pointer; flex-shrink: 0; }
      .toast .toast-close .icon { width: 16px; height: 16px; }
      .toast .toast-close:hover { color: var(--neutral-700); }

      .toast-success { border-left-color: var(--success); }
      .toast-success .toast-icon { color: var(--success); }

      .toast-error { border-left-color: var(--danger); }
      .toast-error .toast-icon { color: var(--danger); }

      .toast-info { border-left-color: var(--primary); }
      .toast-info .toast-icon { color: var(--primary); }

      @keyframes toastIn {
        from { opacity: 0; transform: translateX(100%); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes toastOut {
        to { opacity: 0; transform: translateX(120%); }
      }

      /* ── Modal ────────────────────────────────────────────────────── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.55);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 900;
        padding: 1rem;
        animation: fadeIn 150ms ease-out;
      }

      .modal-overlay.hidden { display: none; }

      .modal {
        background: var(--white);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-xl);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn 200ms ease-out;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--neutral-200);
      }

      .modal-header h3 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--neutral-900);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .modal-header h3 .icon { width: 22px; height: 22px; color: var(--primary); }

      .modal-close {
        background: none;
        border: none;
        color: var(--neutral-400);
        padding: 0.25rem;
        border-radius: var(--radius-sm);
        transition: background-color var(--transition), color var(--transition);
      }
      .modal-close:hover { background: var(--neutral-100); color: var(--neutral-700); }
      .modal-close .icon { width: 20px; height: 20px; }

      .modal-body { padding: 1.25rem; }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--neutral-200);
        background: var(--neutral-50);
        border-radius: 0 0 var(--radius-xl) var(--radius-xl);
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      /* ── Footer ───────────────────────────────────────────────────── */
      .footer {
        text-align: center;
        padding: 2rem 1rem 1.5rem;
        color: var(--neutral-400);
        font-size: 0.8rem;
      }

      /* ── Responsive ───────────────────────────────────────────────── */
      @media (max-width: 768px) {
        .header h1 { font-size: 1.3rem; }
        .header p { font-size: 0.85rem; }
        .form-grid { grid-template-columns: 1fr; }
        .table-wrapper { display: none; }
        .course-cards { display: block; }
        .container { padding: 1rem; }
      }

      @media (max-width: 480px) {
        .header { padding: 2rem 1rem; }
        .header h1 { font-size: 1.15rem; }
        .form-actions { flex-direction: column; align-items: stretch; }
        .form-actions .btn { width: 100%; }
        .modal-footer { flex-direction: column-reverse; }
        .modal-footer .btn { width: 100%; }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <!-- ──────────── Header ──────────── -->
    <header class="header">
      <div class="header-content">
        <h1>CodeCraftHub: Your Learning Management Platform</h1>
        <p>Plan, track, and complete your learning journey — all in one place.</p>
      </div>
    </header>

    <!-- ──────────── Main content ──────────── -->
    <main class="container">
      <!-- ──────────── Add Course Form ──────────── -->
      <section class="panel" id="form-panel">
        <div class="panel-header">
          <h2>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Add New Course
          </h2>
        </div>
        <div class="panel-body">
          <form id="course-form" novalidate>
            <div class="form-grid">
              <div class="form-field">
                <label for="name">Course Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Advanced JavaScript" maxlength="120" />
              </div>
              <div class="form-field">
                <label for="target_date">Target Date <span class="req">*</span></label>
                <input type="date" id="target_date" name="target_date" />
              </div>
              <div class="form-field full">
                <label for="description">Description <span class="req">*</span></label>
                <textarea id="description" name="description" placeholder="Briefly describe what this course covers..." maxlength="500"></textarea>
              </div>
              <div class="form-field">
                <label for="status">Status <span class="req">*</span></label>
                <select id="status" name="status">
                  <option value="">Select a status...</option>
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                <span id="submit-label">Add Course</span>
              </button>
              <button type="button" class="btn btn-secondary" id="reset-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Clear
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- ──────────── Courses List ──────────── -->
      <section class="courses-section">
        <div class="toolbar">
          <div class="section-title">
            Your Courses
            <span class="count-badge" id="count-badge">0</span>
          </div>
          <div class="right">
            <label for="sort-select" style="font-size:0.8rem;font-weight:600;color:var(--neutral-600);">Sort by:</label>
            <select id="sort-select" class="sort-select">
              <option value="created_desc">Newest first</option>
              <option value="created_asc">Oldest first</option>
              <option value="target_asc">Target date (soonest)</option>
              <option value="target_desc">Target date (latest)</option>
              <option value="name_asc">Name (A–Z)</option>
              <option value="name_desc">Name (Z–A)</option>
            </select>
            <button class="btn btn-secondary btn-sm" id="refresh-btn" title="Refresh list">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Desktop: table -->
        <div class="table-wrapper" id="table-wrapper">
          <table class="course-table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Created</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="course-tbody">
            </tbody>
          </table>
        </div>

        <!-- Mobile: cards -->
        <div class="course-cards" id="course-cards"></div>
      </section>
    </main>

    <!-- ──────────── Edit Modal ──────────── -->
    <div class="modal-overlay hidden" id="edit-modal">
      <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-header">
          <h3 id="modal-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            Edit Course
          </h3>
          <button class="modal-close" id="modal-close" aria-label="Close modal">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="edit-form" novalidate>
            <input type="hidden" id="edit-id" />
            <div class="form-grid">
              <div class="form-field full">
                <label for="edit-name">Course Name <span class="req">*</span></label>
                <input type="text" id="edit-name" maxlength="120" />
              </div>
              <div class="form-field full">
                <label for="edit-description">Description <span class="req">*</span></label>
                <textarea id="edit-description" maxlength="500"></textarea>
              </div>
              <div class="form-field">
                <label for="edit-target_date">Target Date <span class="req">*</span></label>
                <input type="date" id="edit-target_date" />
              </div>
              <div class="form-field">
                <label for="edit-status">Status <span class="req">*</span></label>
                <select id="edit-status">
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
          <button class="btn btn-success" id="edit-save">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            <span id="edit-save-label">Save Changes</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ──────────── Toast container ──────────── -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ──────────── Footer ──────────── -->
    <footer class="footer">
      CodeCraftHub &mdash; Learning Management Platform
    </footer>

    <!-- ──────────── App logic ──────────── -->
    <script>
      (function () {
        'use strict';

        /* ═══════════════════════════════════════════════════════════════
         *  CONFIG
         * ═══════════════════════════════════════════════════════════════ */
        const API_BASE = 'http://localhost:5000/api/courses';

        /* ═══════════════════════════════════════════════════════════════
         *  STATE
         * ═══════════════════════════════════════════════════════════════ */
        let courses = [];
        let loading = false;
        let sortMode = 'created_desc';

        /* ═══════════════════════════════════════════════════════════════
         *  DOM REFS
         * ═══════════════════════════════════════════════════════════════ */
        const $ = (id) => document.getElementById(id);

        const form = $('course-form');
        const submitBtn = $('submit-btn');
        const submitLabel = $('submit-label');
        const resetBtn = $('reset-btn');
        const tbody = $('course-tbody');
        const cardsContainer = $('course-cards');
        const tableWrapper = $('table-wrapper');
        const countBadge = $('count-badge');
        const sortSelect = $('sort-select');
        const refreshBtn = $('refresh-btn');

        // Modal refs
        const modal = $('edit-modal');
        const modalClose = $('modal-close');
        const editCancel = $('edit-cancel');
        const editSave = $('edit-save');
        const editSaveLabel = $('edit-save-label');
        const editForm = $('edit-form');
        const editIdInput = $('edit-id');
        const editName = $('edit-name');
        const editDescription = $('edit-description');
        const editTargetDate = $('edit-target_date');
        const editStatus = $('edit-status');

        /* ═══════════════════════════════════════════════════════════════
         *  SVG ICONS (reused)
         * ═══════════════════════════════════════════════════════════════ */
        const ICONS = {
          edit: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>',
          trash: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
          check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
          alert: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
          info: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
          book: '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
          close: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        };

        /* ═══════════════════════════════════════════════════════════════
         *  TOAST NOTIFICATIONS
         * ═══════════════════════════════════════════════════════════════ */
        const toastContainer = $('toast-container');

        function showToast(message, type = 'info', duration = 4000) {
          const iconKey = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info';
          const toast = document.createElement('div');
          toast.className = `toast toast-${type}`;
          toast.innerHTML = `
            ${ICONS[iconKey]}
            <span class="toast-msg">${escapeHtml(message)}</span>
            <button class="toast-close" aria-label="Dismiss">${ICONS.close}</button>
          `;
          toastContainer.appendChild(toast);

          const dismiss = () => {
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 200);
          };

          toast.querySelector('.toast-close').addEventListener('click', dismiss);
          if (duration > 0) setTimeout(dismiss, duration);
        }

        function clearErrors() {
          form.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        }

        /* ═══════════════════════════════════════════════════════════════
         *  UTILITIES
         * ═══════════════════════════════════════════════════════════════ */
        function escapeHtml(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatDate(dateStr) {
          if (!dateStr) return '—';
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return escapeHtml(dateStr);
          return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function statusClass(status) {
          if (status === 'Completed') return 'status-completed';
          if (status === 'In Progress') return 'status-in-progress';
          return 'status-not-started';
        }

        function statusBadge(status) {
          const cls = statusClass(status);
          const label = escapeHtml(status || 'Not Started');
          return `<span class="status-badge ${cls}"><span class="dot"></span>${label}</span>`;
        }

        /* ═══════════════════════════════════════════════════════════════
         *  API FUNCTIONS
         * ═══════════════════════════════════════════════════════════════ */
        async function apiRequest(url, options = {}) {
          const defaultHeaders = { 'Content-Type': 'application/json' };
          options.headers = { ...defaultHeaders, ...(options.headers || {}) };

          const res = await fetch(url, options);

          let body = null;
          const text = await res.text();
          if (text) {
            try { body = JSON.parse(text); } catch { body = text; }
          }

          if (!res.ok) {
            const msg = (body && body.message) || (typeof body === 'string' && body) || `Request failed (${res.status} ${res.statusText})`;
            throw new Error(msg);
          }

          return body;
        }

        async function fetchCourses() {
          setLoading(true);
          try {
            const data = await apiRequest(API_BASE);
            // Handle both array and {courses: [...]} responses
            courses = Array.isArray(data) ? data : (data && Array.isArray(data.courses) ? data.courses : []);
            sortCourses();
            render();
          } catch (err) {
            showToast('Failed to load courses: ' + err.message, 'error', 6000);
            courses = [];
            render();
          } finally {
            setLoading(false);
          }
        }

        async function createCourse(payload) {
          setLoading(true);
          submitBtn.disabled = true;
          submitLabel.textContent = 'Saving...';
          try {
            await apiRequest(API_BASE, {
              method: 'POST',
              body: JSON.stringify(payload),
            });
            showToast('Course added successfully!', 'success');
            form.reset();
            await fetchCourses();
          } catch (err) {
            showToast('Failed to add course: ' + err.message, 'error', 6000);
          } finally {
            setLoading(false);
            submitBtn.disabled = false;
            submitLabel.textContent = 'Add Course';
          }
        }

        async function updateCourse(id, payload) {
          editSave.disabled = true;
          editSaveLabel.textContent = 'Saving...';
          try {
            await apiRequest(`${API_BASE}/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload),
            });
            showToast('Course updated successfully!', 'success');
            closeModal();
            await fetchCourses();
          } catch (err) {
            showToast('Failed to update course: ' + err.message, 'error', 6000);
          } finally {
            editSave.disabled = false;
            editSaveLabel.textContent = 'Save Changes';
          }
        }

        async function deleteCourse(id, name) {
          setLoading(true);
          try {
            await apiRequest(`${API_BASE}/${id}`, { method: 'DELETE' });
            showToast(`"${name}" deleted successfully.`, 'success');
            await fetchCourses();
          } catch (err) {
            showToast('Failed to delete course: ' + err.message, 'error', 6000);
          } finally {
            setLoading(false);
          }
        }

        /* ═══════════════════════════════════════════════════════════════
         *  SORTING
         * ═══════════════════════════════════════════════════════════════ */
        function sortCourses() {
          const [field, dir] = sortMode.split('_');
          const mult = dir === 'desc' ? -1 : 1;
          courses.sort((a, b) => {
            let va, vb;
            if (field === 'created') { va = a.created_at || ''; vb = b.created_at || ''; }
            else if (field === 'target') { va = a.target_date || ''; vb = b.target_date || ''; }
            else if (field === 'name') { va = (a.name || '').toLowerCase(); vb = (b.name || '').toLowerCase(); }
            else return 0;
            if (va < vb) return -1 * mult;
            if (va > vb) return 1 * mult;
            return 0;
          });
        }

        /* ═══════════════════════════════════════════════════════════════
         *  RENDERING
         * ═══════════════════════════════════════════════════════════════ */
        function setLoading(val) {
          loading = val;
          if (val) render();
        }

        function render() {
          countBadge.textContent = courses.length;

          if (loading) {
            tbody.innerHTML = `<tr><td colspan="5"><div class="loading-state"><span class="spinner spinner-lg"></span>Loading courses...</div></td></tr>`;
            cardsContainer.innerHTML = `<div class="loading-state"><span class="spinner spinner-lg"></span>Loading courses...</div>`;
            return;
          }

          if (courses.length === 0) {
            const emptyHtml = `
              <div class="empty-state">
                ${ICONS.book}
                <p>No courses yet</p>
                <small>Add your first course using the form above.</small>
              </div>`;
            tbody.innerHTML = `<tr><td colspan="5">${emptyHtml}</td></tr>`;
            cardsContainer.innerHTML = emptyHtml;
            return;
          }

          // Table rows
          tbody.innerHTML = courses.map(c => `
            <tr data-id="${escapeHtml(c.id)}">
              <td>
                <div class="course-name">${escapeHtml(c.name)}</div>
                <div class="course-description">${escapeHtml(c.description)}</div>
              </td>
              <td><span class="course-date">${formatDate(c.target_date)}</span></td>
              <td>${statusBadge(c.status)}</td>
              <td><span class="course-created">${formatDate(c.created_at)}</span></td>
              <td class="row-actions">
                <button class="btn btn-ghost-primary btn-sm" data-action="edit" data-id="${escapeHtml(c.id)}" title="Edit course">${ICONS.edit}Edit</button>
                <button class="btn btn-ghost-danger btn-sm" data-action="delete" data-id="${escapeHtml(c.id)}" data-name="${escapeHtml(c.name)}" title="Delete course">${ICONS.trash}Delete</button>
              </td>
            </tr>
          `).join('');

          // Cards
          cardsContainer.innerHTML = courses.map(c => `
            <div class="course-card" data-id="${escapeHtml(c.id)}">
              <div class="card-top">
                <span class="course-name card-name">${escapeHtml(c.name)}</span>
                ${statusBadge(c.status)}
              </div>
              <p class="card-desc">${escapeHtml(c.description)}</p>
              <div class="card-meta">
                <span>Target: ${formatDate(c.target_date)}</span>
                <span>Created: ${formatDate(c.created_at)}</span>
              </div>
              <div class="card-actions">
                <button class="btn btn-secondary btn-sm" data-action="edit" data-id="${escapeHtml(c.id)}">${ICONS.edit}Edit</button>
                <button class="btn btn-danger btn-sm" data-action="delete" data-id="${escapeHtml(c.id)}" data-name="${escapeHtml(c.name)}">${ICONS.trash}Delete</button>
              </div>
            </div>
          `).join('');
        }

        /* ═══════════════════════════════════════════════════════════════
         *  VALIDATION
         * ═══════════════════════════════════════════════════════════════ */
        function validateForm(formData) {
          const errors = [];
          let firstErrorField = null;

          const fields = [
            { name: 'name', label: 'Course Name', el: form.querySelector('#name') },
            { name: 'description', label: 'Description', el: form.querySelector('#description') },
            { name: 'target_date', label: 'Target Date', el: form.querySelector('#target_date') },
            { name: 'status', label: 'Status', el: form.querySelector('#status') },
          ];

          fields.forEach(f => {
            const val = (formData[f.name] || '').toString().trim();
            if (!val) {
              errors.push(`${f.label} is required.`);
              f.el.classList.add('error');
              if (!firstErrorField) firstErrorField = f.el;
            } else {
              f.el.classList.remove('error');
            }
          });

          // Date format check
          if (formData.target_date && !/^\d{4}-\d{2}-\d{2}$/.test(formData.target_date)) {
            errors.push('Target Date must be in YYYY-MM-DD format.');
            const el = form.querySelector('#target_date');
            el.classList.add('error');
            if (!firstErrorField) firstErrorField = el;
          }

          // Status value check
          const validStatuses = ['Not Started', 'In Progress', 'Completed'];
          if (formData.status && !validStatuses.includes(formData.status)) {
            errors.push('Please select a valid status.');
            const el = form.querySelector('#status');
            el.classList.add('error');
            if (!firstErrorField) firstErrorField = el;
          }

          if (firstErrorField) firstErrorField.focus();
          return errors;
        }

        function validateEditForm(data) {
          const errors = [];
          let firstErrorField = null;

          if (!data.name || !data.name.trim()) {
            errors.push('Course Name is required.');
            editName.classList.add('error');
            firstErrorField = editName;
          } else editName.classList.remove('error');

          if (!data.description || !data.description.trim()) {
            errors.push('Description is required.');
            editDescription.classList.add('error');
            if (!firstErrorField) firstErrorField = editDescription;
          } else editDescription.classList.remove('error');

          if (!data.target_date) {
            errors.push('Target Date is required.');
            editTargetDate.classList.add('error');
            if (!firstErrorField) firstErrorField = editTargetDate;
          } else editTargetDate.classList.remove('error');

          if (!data.status) {
            errors.push('Status is required.');
            editStatus.classList.add('error');
            if (!firstErrorField) firstErrorField = editStatus;
          } else editStatus.classList.remove('error');

          if (firstErrorField) firstErrorField.focus();
          return errors;
        }

        /* ═══════════════════════════════════════════════════════════════
         *  MODAL
         * ═══════════════════════════════════════════════════════════════ */
        function openModal(course) {
          editIdInput.value = course.id;
          editName.value = course.name || '';
          editDescription.value = course.description || '';
          editTargetDate.value = course.target_date || '';
          editStatus.value = course.status || 'Not Started';

          // Clear any error styling
          [editName, editDescription, editTargetDate, editStatus].forEach(el => el.classList.remove('error'));

          modal.classList.remove('hidden');
          editName.focus();
        }

        function closeModal() {
          modal.classList.add('hidden');
          editForm.reset();
          [editName, editDescription, editTargetDate, editStatus].forEach(el => el.classList.remove('error'));
        }

        /* ═══════════════════════════════════════════════════════════════
         *  EVENT HANDLERS
         * ═══════════════════════════════════════════════════════════════ */

        // Form submit (add course)
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          clearErrors();

          const formData = {
            name: form.name.value.trim(),
            description: form.description.value.trim(),
            target_date: form.target_date.value,
            status: form.status.value,
          };

          const errors = validateForm(formData);
          if (errors.length > 0) {
            errors.forEach(err => showToast(err, 'error', 4000));
            return;
          }

          createCourse(formData);
        });

        // Reset form
        resetBtn.addEventListener('click', () => {
          form.reset();
          clearErrors();
        });

        // Sort change
        sortSelect.addEventListener('change', () => {
          sortMode = sortSelect.value;
          sortCourses();
          render();
        });

        // Refresh
        refreshBtn.addEventListener('click', () => fetchCourses());

        // Course list actions (event delegation)
        document.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;

          const action = btn.dataset.action;
          const id = btn.dataset.id;

          if (action === 'edit') {
            const course = courses.find(c => String(c.id) === String(id));
            if (course) openModal(course);
          } else if (action === 'delete') {
            const name = btn.dataset.name || 'this course';
            if (confirm(`Are you sure you want to delete "${name}"? This action cannot be undone.`)) {
              deleteCourse(id, name);
            }
          }
        });

        // Modal controls
        modalClose.addEventListener('click', closeModal);
        editCancel.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        // Edit save
        editSave.addEventListener('click', () => {
          const id = editIdInput.value;
          const data = {
            name: editName.value.trim(),
            description: editDescription.value.trim(),
            target_date: editTargetDate.value,
            status: editStatus.value,
          };

          const errors = validateEditForm(data);
          if (errors.length > 0) {
            errors.forEach(err => showToast(err, 'error', 4000));
            return;
          }

          updateCourse(id, data);
        });

        /* ═══════════════════════════════════════════════════════════════
         *  INIT
         * ═══════════════════════════════════════════════════════════════ */
        fetchCourses();
      })();
    </script>
  </body>
</html>
